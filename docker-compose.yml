services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homeostat
    ports:
      - "5433:5432" # 5432 is taken by Homebrew postgresql@16
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homeostat"]
      interval: 5s
      retries: 10

  api:
    # Optional: `HOMEOSTAT_API_KEY=... docker compose --profile api up -d --build`.
    # `docker compose up -d db` alone is unaffected.
    profiles: ["api"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/homeostat
      HOMEOSTAT_API_KEY: ${HOMEOSTAT_API_KEY:-}  # the app refuses to start without it
      HOMEOSTAT_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
