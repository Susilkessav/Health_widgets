services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: homeostat
    ports:
      - "5433:5432" # 5432 is taken by Homebrew postgresql@16
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homeostat"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
