# Backend tests (with PostgreSQL), the Swift package tests (including the
# Python/Swift engine parity fixture) and an app + widget simulator build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:  # mirrors docker-compose.yml so tests/conftest.py's default URL works
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homeostat
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d homeostat"
          --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Includes the fixture checks: a stale engine_parity.json, widget_states.jsonl
      # or demo_states.json fails here rather than drifting from the Swift side.
      - run: uv run pytest -q

  swift:
    # The package and app need the Xcode that ships the iOS 27 SDK; if the
    # hosted image lags, pin a newer macOS image or a self-hosted runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Swift package tests (engine parity, widget cache, avatar)
        working-directory: ios/HomeostatCore
        run: swift test
      - name: App and widget build (needs Xcode 27)
        working-directory: ios/Homeostat
        # The project uses Xcode 27's file format and targets iOS 27, which older
        # Xcode can't open. Skips with a warning until the runner image has it.
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::warning::No Xcode 27 on this runner; app build skipped (package tests above still ran)."
            exit 0
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -project Homeostat.xcodeproj -scheme Homeostat \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
